# Settings for running the ready-made Duuni-Bot image from quay.io.
# Plain key=value settings; sourced by the scripts.

# The published image on quay.io.
IMAGE_NAME="quay.io/vellamo/duuni-bot:latest"
CONTAINER_NAME="duuni-bot"

# Non-root user UID baked into the image (keep in sync with the Dockerfile).
CONTAINER_UID="10001"

# Default data directory (mounted at /data inside the container).
DATA_DIR="$HOME/duuni-data"

# Default cron schedule passed to the container.
CRON_SCHEDULE="0 3 * * *"
