# Shared configuration for the macOS build and run scripts.
# Plain key=value settings; sourced by the scripts.

# Container image tag and container name.
IMAGE_NAME="duuni-bot:local"
CONTAINER_NAME="duuni-bot"

# Non-root user UID baked into the image (keep in sync with the Dockerfile).
CONTAINER_UID="10001"

# Base images pulled by the Dockerfile (space-separated; removed by the clean script).
BASE_IMAGES="rust:1-bookworm debian:bookworm-slim"

# Apple Container CLI GitHub release API (used by the installer).
CONTAINER_CLI_API="https://api.github.com/repos/apple/container/releases/latest"

# Minimum macOS version required by Apple Container CLI.
MACOS_MIN="26.0"

# Default data directory (mounted at /data, the path from the Dockerfile).
# run-container-macos.sh overrides DATA_DIR with DB_ENV_PATH_DATA when valid.
DATA_DIR="$HOME/duuni-data"

# Defaults passed to the container at run time (edit this file to change them).
CRON_SCHEDULE="0 3 * * *"
